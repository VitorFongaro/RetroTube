<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RetroTube - Retro Video Downloader</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="stars">
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
    </div>
    <div class="container">
        <h1 class="title">RetroTube</h1>
        <form class="main-box" id="download-form">
            <div class="input-wrapper">
                <input type="url" class="url-input" id="url-input" placeholder="INSERT YOUTUBE LINK HERE..."
                    spellcheck="false" autocomplete="off" required>
            </div>
            <button class="download-btn" id="scan-button" type="submit">
                DOWNLOAD
            </button>
            <div class="game-status" id="game-status" aria-live="polite"></div>
            <div class="progress-shell" id="progress-shell" hidden>
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <section class="result-panel" id="result-panel" hidden>
                <div class="video-card">
                    <img class="video-thumb" id="video-thumb" alt="">
                    <div class="video-meta">
                        <p class="video-title" id="video-title"></p>
                        <p class="video-uploader" id="video-uploader"></p>
                    </div>
                </div>
                <div class="option-zone">
                    <p class="option-title">VIDEO</p>
                    <div class="option-grid" id="video-options"></div>
                </div>
                <div class="option-zone">
                    <p class="option-title">MUSIC</p>
                    <div class="option-grid" id="audio-options"></div>
                </div>
            </section>
        </form>
        <p class="footer-note" id="footer-note">INSERT COIN TO PLAY</p>
    </div>
    <script src="app.js"></script>
</body>
</html>
